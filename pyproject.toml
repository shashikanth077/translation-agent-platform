[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "translation-agent-platform"
version = "0.1.0"
description = "Agentic NMT + LLM translation platform: LangGraph orchestration, MCP-gated tools, multi-judge consensus scoring, tiered reuse and A/B experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "rapidfuzz>=3.6",
  "tenacity>=8.2",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "defusedxml>=0.7",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
redis = ["redis>=5.0"]
mcp = ["mcp>=1.2"]
langsmith = ["langsmith>=0.2"]
# Heavy model-based evaluators (COMET-Kiwi, LaBSE). Needs a GPU for production throughput.
ml = ["unbabel-comet>=2.2", "sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-jsonschema"]
all = ["translation-agent-platform[anthropic,redis,mcp,langsmith]"]

[project.scripts]
tap = "tap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: end-to-end tests that spin up the whole platform"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E501", "RUF", "PT018", "PT011", "PT012", "C408", "SIM117"]
"src/tap/demo/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["tap"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/tap"]
branch = true
